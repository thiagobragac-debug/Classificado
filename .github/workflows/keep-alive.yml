name: Keep-alive (Render Free Tier)

# Render Free Tier hiberna o serviço depois de ~15min sem tráfego, causando
# cold-start de 50s+ pro próximo visitante. Este workflow bate em /api/health
# a cada 10min pra nunca deixar passar essa janela de inatividade.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: curl -sf https://www.tauzeclass.com.br/api/health
