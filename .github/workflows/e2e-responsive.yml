name: E2E (Playwright)

# Roda TODOS os specs de tests/e2e/ a cada push/PR na main (npm run test:e2e
# = `playwright test`, sem filtro de --project) — é o mecanismo que faz o
# teste rodar de verdade, sem depender de alguém lembrar de rodar na mão
# antes de subir. Hoje cobre 2 grupos independentes (ver playwright.config.ts):
#   - responsive-smoke.spec.ts (4 projetos de viewport: 320/375/900/1440px)
#     nasceu depois de vários bugs de layout mobile (imagem sumindo, cartão
#     virando cápsula gigante, badge cortando texto, busca prendendo o
#     usuário) só terem sido descobertos DEPOIS de já estarem em produção.
#   - anunciar.spec.ts / login.spec.ts (projeto "functional", 1 viewport) —
#     fluxos funcionais sem depender de conta real (revisão de cobertura de
#     testes, 2026-09-26); achou e confirmou o fix de um bug real ao vivo
#     (botão de mostrar/ocultar senha colapsava pra 0×0 em qualquer viewport
#     acima de 992px — ver app/globals.css).
# Nome do workflow mantido genérico ("E2E") de propósito, já que não é só
# responsividade — o nome anterior ("Teste de responsividade") já não
# descrevia o que ele de fato cobre.
#
# Precisa destes Secrets configurados em
# Settings → Secrets and variables → Actions (nunca são impressos em log):
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#   SUPABASE_SERVICE_ROLE_KEY
# Sem eles a home/listagem não carregam dados reais e o job falha — de
# propósito (fail-closed), pra nunca dar falso positivo de "passou" sem
# ter testado nada de verdade.
on:
  push:
    branches: [main]
    paths:
      - 'nextjs-app/**'
  pull_request:
    branches: [main]
    paths:
      - 'nextjs-app/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: nextjs-app

jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nextjs-app/package-lock.json

      - name: Instala dependências
        run: npm ci

      - name: Instala navegador do Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Roda o suite de responsividade
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:e2e

      - name: Publica relatório (só quando falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nextjs-app/playwright-report/
          retention-days: 14
